name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build -t joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }} .
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }}

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          kubectl set image deployment/demo-app demo-app=joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }}

name: Deploy to Kubernetes

on:
  push:
    branches:
      - main  # Esto se activa cuando haces un push a la rama principal (main)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Usa un contenedor de Ubuntu para ejecutar los pasos

    steps:
      # 1. Checkout: obtenemos el código del repositorio
      - uses: actions/checkout@v3

      # 2. Configuración de Docker: preparamos el entorno para crear y subir imágenes
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # 3. Construir y subir la imagen Docker
      - name: Build and push Docker image
        run: |
          docker build -f app/Dockerfile -t joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }} .
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }}

      # 4. Desplegar a Kubernetes: Actualiza la imagen en tu clúster
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}  # Asegúrate de tener este secreto creado en GitHub
        run: |
          kubectl set image deployment/demo-app demo=joshuamsaechao/reto-4-arquitectura-kubernetes:${{ github.sha }}
